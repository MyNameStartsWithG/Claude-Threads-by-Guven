<path d="M256 228H368" fill="none" class="edge" stroke-width="1.25" marker-end="url(#arrow)"/>
<path d="M528 216H560" fill="none" class="edge" stroke-width="1.25" marker-end="url(#arrow)"/>
<path d="M560 244H528" fill="none" class="edge" stroke-width="1.25" marker-end="url(#arrow)"/>
<text x="304" y="218" text-anchor="middle" font-size="11.5" class="quiet">her cevaptan</text>
<text x="304" y="246" text-anchor="middle" font-size="11.5" class="quiet">~4 sn sonra</text>
