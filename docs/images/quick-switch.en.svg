<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" width="760" role="img" aria-label="Ctrl+Shift+Alt+T reaches every thread from one box" font-size="13">
<style>
  text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
  .ink{fill:#1f2328}.quiet{fill:#59636e}.edge{stroke:#8c959f}.edgef{fill:#8c959f}.grid{stroke:#d1d9e0}
  .acc{stroke:#0969da}.accf{fill:#0969da}.tint{fill:#eff2f5}.sel{fill:#0969da;fill-opacity:.12}
  @media (prefers-color-scheme: dark){
    .ink{fill:#f0f6fc}.quiet{fill:#9198a1}.edge{stroke:#656c76}.edgef{fill:#656c76}.grid{stroke:#3d444d}
    .acc{stroke:#4493f8}.accf{fill:#4493f8}.tint{fill:#151b23}.sel{fill:#4493f8;fill-opacity:.18}
  }
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="edgef"/></marker></defs>
<text x="24" y="34" font-size="15" font-weight="600" class="ink">Ctrl+Shift+Alt+T reaches every thread from one box</text>
<rect x="24" y="56" width="480" height="250" rx="8" fill="none" class="edge" stroke-width="1.25"/>
<text x="264" y="76" text-anchor="middle" font-size="11.5" font-weight="600" class="quiet">Claude threads</text>
<rect x="36" y="88" width="456" height="28" rx="4" fill="none" class="acc" stroke-width="1.5"/>
<text x="48" y="106" font-size="12" class="quiet">Pick a thread…</text>
<rect x="25" y="123" width="478" height="26" class="sel"/>
<text x="48" y="141" text-anchor="middle" font-size="15" class="ink">+</text>
<text x="64" y="140" font-size="12" class="ink">New thread</text>
<line x1="36" y1="160" x2="440" y2="160" class="grid"/>
<text x="492" y="164" text-anchor="end" font-size="11" class="quiet">Open</text>
<rect x="42" y="181" width="12" height="10" rx="2" fill="none" class="edge" stroke-width="1.25"/><path d="M45 184l2 2l-2 2" fill="none" class="edge" stroke-width="1.25"/>
<text x="64" y="190" font-size="12" class="ink">Refactor auth module</text>
<text x="236" y="190" font-size="11" class="quiet">working</text>
<rect x="42" y="207" width="12" height="10" rx="2" fill="none" class="edge" stroke-width="1.25"/><path d="M45 210l2 2l-2 2" fill="none" class="edge" stroke-width="1.25"/>
<text x="64" y="216" font-size="12" class="ink">Write API docs</text>
<rect x="42" y="233" width="12" height="10" rx="2" fill="none" class="edge" stroke-width="1.25"/><path d="M45 236l2 2l-2 2" fill="none" class="edge" stroke-width="1.25"/>
<text x="64" y="242" font-size="12" class="ink">Fix flaky tests</text>
<line x1="36" y1="262" x2="290" y2="262" class="grid"/>
<text x="492" y="266" text-anchor="end" font-size="11" class="quiet">Done (selecting reopens it)</text>
<circle cx="48" cy="288" r="5" fill="none" class="edge" stroke-width="1.25"/><path d="M45.5 288l2 2l3.5 -3.5" fill="none" class="edge" stroke-width="1.25"/>
<text x="64" y="292" font-size="12" class="ink">Migrate to Postgres</text>
<text x="196" y="292" font-size="11" class="quiet">3 h ago</text>
<g fill="none" class="edge" stroke-width="1"><path d="M504 102H522"/><path d="M504 140H522"/><path d="M510 174H516V250H510"/><path d="M516 212H522"/><path d="M504 288H522"/></g>
<text x="528" y="98" font-weight="600" class="ink">Type to filter</text>
<text x="528" y="114" font-size="11.5" class="quiet">matches names and descriptions</text>
<text x="528" y="144" font-weight="600" class="ink">On top: new thread</text>
<text x="528" y="160" font-size="11.5" class="quiet">asks a name, opens a new tab</text>
<text x="528" y="204" font-weight="600" class="ink">Open threads</text>
<text x="528" y="220" font-size="11.5" class="quiet">brought forward if running,</text>
<text x="528" y="236" font-size="11.5" class="quiet">otherwise resumed</text>
<text x="528" y="284" font-weight="600" class="ink">Done threads</text>
<text x="528" y="300" font-size="11.5" class="quiet">the last 30; picking one</text>
<text x="528" y="316" font-size="11.5" class="quiet">reopens it</text>
</svg>
